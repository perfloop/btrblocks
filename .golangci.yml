version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocheckcompilerdirectives
    - misspell
    - nilerr
    - nilnesserr
    - nolintlint
    - revive
  settings:
    revive:
      enable-default-rules: true
      rules:
        # Interface methods already document these contracts; repeating the
        # same text on every concrete implementation obscures the code.
        - name: exported
          disabled: true
